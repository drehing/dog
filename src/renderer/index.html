<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dog 秘书</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.1" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 4.6 4.6L19.5 6.7" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" /><path d="M12 7.2V12l3.2 2" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.8 21 20H3zM12 9v5M12 17.2h.1" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m4 11.5 16-7-4.4 15-4-5.7zM11.6 13.8 20 4.5" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9 6.5V4.2h6v2.3M7 6.5l.9 13.1h8.2L17 6.5M10 10.2v6M14 10.2v6" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4.5 16.8-.7 3.4 3.4-.7L19 7.7 15.3 4zM13.6 5.7l4.7 4.7" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 0 0 6.3 6.7L4 9M4 4v5h5M4 12.5a8 8 0 0 0 13.7 4.8L20 15M20 20v-5h-5" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.8 19 12 8 19.2z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" /></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.6" /><path d="M11.6 12H21M17.4 12v3M14.4 12v2.2" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.2 19 6v5.6c0 4.3-3 7.6-7 9.2-4-1.6-7-4.9-7-9.2V6z" /><path d="m9 11.8 2.1 2.1 4-4.2" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.8h6l1.8 2.2h9.2v10.2a1.4 1.4 0 0 1-1.4 1.4H4.9a1.4 1.4 0 0 1-1.4-1.4z" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10.5 12 15l4.5-4.5M4 18.5v1.2h16v-1.2" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.8" y="5.2" width="16.4" height="15" rx="2.2" /><path d="M3.8 9.4h16.4M8.2 3.2v4M15.8 3.2v4" /></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.2 13.9 9l5.8 1.9-5.8 1.9L12 18.6l-1.9-5.8L4.3 11 10.1 9zM18.6 16.8l.8 2.4 2.4.8-2.4.8-.8 2.4-.8-2.4-2.4-.8 2.4-.8z" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2" /><path d="M15.5 8.5V5.8a1.8 1.8 0 0 0-1.8-1.8H5.8A1.8 1.8 0 0 0 4 5.8v7.9a1.8 1.8 0 0 0 1.8 1.8h2.7" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.2a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 18.2V7.8A1.8 1.8 0 0 1 5.8 6H10" /></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9.8a6 6 0 0 0-12 0c0 6-2.2 7.2-2.2 7.2h16.4S18 15.8 18 9.8zM10 20h4" /></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.8h3.2L12 5.8v12.4L7.2 14.2H4zM15.8 9a4.4 4.4 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2" /></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3.2" y="4.2" width="17.6" height="12" rx="1.8" /><path d="M9 20h6M12 16.2V20" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.3 8.3 0 1 0 20 14.2z" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M9.5 14.5 14.5 9.5M8.2 11.2 6.5 12.9a4.6 4.6 0 0 0 6.5 6.5l1.7-1.7M15.8 12.8l1.7-1.7a4.6 4.6 0 0 0-6.5-6.5L9.3 6.3" /></symbol>
    </svg>

    <div id="app" class="app">
      <header class="titlebar">
        <div class="brand">
          <img class="brand-logo" src="../../assets/icon.png" alt="" />
          <span class="brand-name">Dog</span>
          <span class="brand-sub">秘书</span>
        </div>
        <button class="model-chip" id="model-chip" data-action="nav:settings" title="模型设置">
          <span class="dot" id="model-dot"></span>
          <span id="model-name">演示模式</span>
        </button>
        <div class="win-controls">
          <button class="win-btn" data-action="win:min" title="最小化" aria-label="最小化">
            <svg class="ic"><use href="#i-minus"></use></svg>
          </button>
          <button class="win-btn win-close" data-action="win:hide" title="收起到托盘" aria-label="收起到托盘">
            <svg class="ic"><use href="#i-x"></use></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="tabbar">
        <button class="tab" data-action="nav:home" data-tab="home">
          <span class="tab-ico"><svg class="ic"><use href="#i-home"></use></svg></span>
          <span>今日</span>
        </button>
        <button class="tab" data-action="nav:chat" data-tab="chat">
          <span class="tab-ico"><svg class="ic"><use href="#i-chat"></use></svg></span>
          <span>对话</span>
        </button>
        <button class="tab" data-action="nav:agents" data-tab="agents">
          <span class="tab-ico"><svg class="ic"><use href="#i-bot"></use></svg><i class="badge" id="badge-agents"></i></span>
          <span>监工</span>
        </button>
        <button class="tab" data-action="nav:inbox" data-tab="inbox">
          <span class="tab-ico"><svg class="ic"><use href="#i-inbox"></use></svg><i class="badge" id="badge-inbox"></i></span>
          <span>收件箱</span>
        </button>
        <button class="tab" data-action="nav:settings" data-tab="settings">
          <span class="tab-ico"><svg class="ic"><use href="#i-settings"></use></svg></span>
          <span>设置</span>
        </button>
      </nav>

      <div id="overlay" class="overlay hidden"></div>
      <div id="onboarding" class="onboarding hidden"></div>
      <div id="app-toast" class="app-toast"></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
